<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Theme, inspired by Kite/Zerodha) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Bull Horn / Growth Accent Gradient (Trading Red/Orange to Emerald Green) -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Sleek Monochromatic Blue-Grey for Primary Shapes -->
    <linearGradient id="primaryShape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3546"/>
      <stop offset="100%" stop-color="#1e2532"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="120" rx="16" fill="url(#bgGradient)"/>

  <!-- GEOMETRIC ISOMETRIC LOGOMARK (Abstract Bull + Bullish Trend) -->
  <g transform="translate(20, 0)">
    <!-- Base Left Facing Wedge (Bull Jaw/Left Flank) -->
    <polygon points="50,68 75,53 75,83 50,98" fill="url(#primaryShape)" opacity="0.9"/>

    <!-- Base Right Facing Wedge (Bull Neck/Base) -->
    <polygon points="75,53 100,68 100,98 75,83" fill="#18202c"/>

    <!-- Left Horn Wedge (Strength/Structure) -->
    <polygon points="50,38 75,23 75,53 50,68" fill="#3b485d"/>

    <!-- Right Horn / Upward Trend Arrow (Accent Color - The "Big Bull" Breakout) -->
    <polygon points="75,23 108,3 100,43 75,53" fill="url(#accentGradient)"/>

    <!-- Geometric Facet Overlay for Depth/Precision -->
    <polygon points="75,23 100,38 75,53" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- TYPOGRAPHY (Minimalist, Clean Modern Sans-Serif) -->
  <!-- "Big" in High-Contrast Crisp White -->
  <text x="145" y="73" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Roboto', sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="-0.5">Big</text>

  <!-- "Bull" in Bright Emerald Green Accent -->
  <text x="212" y="73" 
        fill="#10b981" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Roboto', sans-serif" 
        font-size="38" 
        font-weight="400" 
        letter-spacing="-0.5">Bull</text>

  <!-- Tagline / Subtext (Zerodha/Kite Style) -->
  <text x="146" y="93" 
        fill="#6b7280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Roboto', sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="1.5" 
        opacity="0.85">INVESTMENT PLATFORM</text>
</svg>
